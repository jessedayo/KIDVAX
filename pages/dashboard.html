<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KIDVAX — Dashboard</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/navbar.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <a href="dashboard.html" class="navbar-brand">💉 KIDVAX</a>
      <ul class="navbar-nav">
        <li><a href="dashboard.html" class="nav-link active">Dashboard</a></li>
        <li><a href="children.html" class="nav-link">Children</a></li>
        <li><a href="vaccine-info.html" class="nav-link">Vaccines</a></li>
        <li><a href="notifications.html" class="nav-link">Reminders</a></li>
        <li><a href="about.html" class="nav-link">About</a></li>
        <li><a href="contact.html" class="nav-link">Contact</a></li>
      </ul>
      <div class="navbar-right">
        <span class="navbar-user" id="user-name"></span>
        <button class="btn-logout" onclick="logout()">Logout</button>
      </div>
    </nav>

    <div class="main-content">
      <div class="container">
        <!-- Welcome Banner -->
        <div class="dashboard-welcome">
          <h1>👋 Welcome back, <span id="welcome-name"></span>!</h1>
          <p>Here's a summary of your children's vaccination status.</p>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon blue">👶</div>
            <div>
              <div class="stat-label">Children</div>
              <div class="stat-value" id="total-children">0</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon green">✅</div>
            <div>
              <div class="stat-label">Completed</div>
              <div class="stat-value" id="total-completed">0</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon yellow">🕐</div>
            <div>
              <div class="stat-label">Upcoming</div>
              <div class="stat-value" id="total-upcoming">0</div>
            </div>
          </div>
        </div>

        <!-- Children Summary -->
        <div class="dashboard-section">
          <h2>👶 My Children</h2>
          <div class="children-summary" id="children-list">
            <p class="text-muted">Loading...</p>
          </div>
        </div>
      </div>
    </div>

    <script src="../js/dashboard.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KIDVAX — Reset Password</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-logo">
          <div class="auth-logo-icon">💉</div>
          <h1>KIDVAX</h1>
          <p>Child Vaccination Tracker</p>
        </div>

        <h2>Reset Password</h2>
        <p
          class="text-muted text-center"
          style="margin-bottom: 24px; font-size: 14px"
        >
          Enter your new password below.
        </p>

        <div
          id="error-msg"
          class="alert alert-error"
          style="display: none"
        ></div>
        <div
          id="success-msg"
          class="alert alert-success"
          style="display: none"
        ></div>

        <form id="reset-form">
          <div class="form-group">
            <label>New Password</label>
            <input
              type="password"
              id="new-password"
              placeholder="Enter new password"
              required
              oninput="checkStrength()"
            />
            <div style="margin-top: 10px">
              <div style="display: flex; gap: 4px; margin-bottom: 8px">
                <div
                  id="bar1"
                  style="
                    height: 4px;
                    flex: 1;
                    border-radius: 4px;
                    background: var(--border);
                    transition: all 0.3s;
                  "
                ></div>
                <div
                  id="bar2"
                  style="
                    height: 4px;
                    flex: 1;
                    border-radius: 4px;
                    background: var(--border);
                    transition: all 0.3s;
                  "
                ></div>
                <div
                  id="bar3"
                  style="
                    height: 4px;
                    flex: 1;
                    border-radius: 4px;
                    background: var(--border);
                    transition: all 0.3s;
                  "
                ></div>
                <div
                  id="bar4"
                  style="
                    height: 4px;
                    flex: 1;
                    border-radius: 4px;
                    background: var(--border);
                    transition: all 0.3s;
                  "
                ></div>
              </div>
              <p
                id="strength-text"
                style="
                  font-size: 12px;
                  color: var(--text-muted);
                  margin-bottom: 8px;
                "
              ></p>
              <div style="font-size: 12px; color: var(--text-muted)">
                <p id="req-length" style="margin-bottom: 4px">
                  ❌ At least 8 characters
                </p>
                <p id="req-upper" style="margin-bottom: 4px">
                  ❌ At least one uppercase letter
                </p>
                <p id="req-number" style="margin-bottom: 4px">
                  ❌ At least one number
                </p>
                <p id="req-special" style="margin-bottom: 4px">
                  ❌ At least one special character (!@#$...)
                </p>
              </div>
            </div>
          </div>
          <div class="form-group">
            <label>Confirm New Password</label>
            <input
              type="password"
              id="confirm-password"
              placeholder="Confirm new password"
              required
            />
          </div>
          <button type="submit" class="btn btn-primary auth-submit-btn">
            Reset Password
          </button>
        </form>

        <div class="auth-footer">
          Remember your password? <a href="../index.html">Login here</a>
        </div>
      </div>
    </div>

    <script src="../js/reset-password.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KIDVAX — Login</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">

      <div class="auth-logo">
        <div class="auth-logo-icon">💉</div>
        <h1>KIDVAX</h1>
        <p>Child Vaccination Tracker</p>
      </div>

      <h2>Welcome Back</h2>

      <div id="error-msg" class="alert alert-error" style="display:none;"></div>

      <form id="login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="Enter your email" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Enter your password" required />
        </div>
        <button type="submit" class="btn btn-primary auth-submit-btn">Login</button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="pages/register.html">Register here</a>
      </div>

    </div>
  </div>

  <script src="js/auth.js"></script>

</body>
</html>
